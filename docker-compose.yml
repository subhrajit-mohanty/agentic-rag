version: '3.9'

services:
  # ============================================
  # MongoDB - Primary Document Store
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: rag-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-raguser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ragpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-enterprise_rag}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # ============================================
  # Redis - Caching & Session Store
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ============================================
  # Backend API Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB
      - MONGO_URI=mongodb://${MONGO_USERNAME:-raguser}:${MONGO_PASSWORD:-ragpassword}@mongodb:27017/${MONGO_DATABASE:-enterprise_rag}?authSource=admin
      - MONGO_DATABASE=${MONGO_DATABASE:-enterprise_rag}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # OpenAI (Required)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=openai
      - LLM_OPENAI_MODEL=${LLM_OPENAI_MODEL:-gpt-4o-mini}
      - VECTOR_EMBEDDING_PROVIDER=openai
      - VECTOR_OPENAI_EMBEDDING_MODEL=${VECTOR_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      
      # Application
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      
      # Security
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - backend_cache:/app/.cache
    networks:
      - rag-network

  # ============================================
  # Frontend Service
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - rag-network

  # ============================================
  # Mongo Express - Database Admin UI (Dev only)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: rag-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-raguser}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-ragpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME:-raguser}:${MONGO_PASSWORD:-ragpassword}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - dev
    networks:
      - rag-network

  # ============================================
  # Redis Commander - Cache Admin UI (Dev only)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rag-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    profiles:
      - dev
    networks:
      - rag-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_cache:
    driver: local

networks:
  rag-network:
    driver: bridge
    name: enterprise-rag-network
