version: '3.9'

services:
  # ============================================
  # Milvus Vector Database Dependencies
  # ============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-network

  # ============================================
  # Milvus Vector Database
  # ============================================
  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MILVUS_LOG_LEVEL: info
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    networks:
      - rag-network

  # ============================================
  # MongoDB - Primary Document Store
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: rag-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-raguser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ragpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-enterprise_rag}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # ============================================
  # Redis - Caching & Session Store
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ============================================
  # Backend API Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB
      - MONGO_URI=mongodb://${MONGO_USERNAME:-raguser}:${MONGO_PASSWORD:-ragpassword}@mongodb:27017/${MONGO_DATABASE:-enterprise_rag}?authSource=admin
      - MONGO_DATABASE=${MONGO_DATABASE:-enterprise_rag}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # OpenAI (Required)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=openai
      - LLM_OPENAI_MODEL=${LLM_OPENAI_MODEL:-gpt-4o-mini}
      - VECTOR_EMBEDDING_PROVIDER=openai
      - VECTOR_OPENAI_EMBEDDING_MODEL=${VECTOR_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      
      # Milvus Vector Database
      - VECTOR_PROVIDER=${VECTOR_STORE_PROVIDER:-milvus}
      - VECTOR_MILVUS_HOST=milvus
      - VECTOR_MILVUS_PORT=19530
      - VECTOR_MILVUS_COLLECTION=${MILVUS_COLLECTION:-enterprise_rag_docs}
      
      # Application
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      
      # Security
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - backend_cache:/app/.cache
    networks:
      - rag-network

  # ============================================
  # Frontend Service
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - rag-network

  # ============================================
  # Mongo Express - Database Admin UI (Dev only)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: rag-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-raguser}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-ragpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME:-raguser}:${MONGO_PASSWORD:-ragpassword}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - dev
    networks:
      - rag-network

  # ============================================
  # Redis Commander - Cache Admin UI (Dev only)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rag-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    profiles:
      - dev
    networks:
      - rag-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_cache:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local

networks:
  rag-network:
    driver: bridge
    name: enterprise-rag-network
